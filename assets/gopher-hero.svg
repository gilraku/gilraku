<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Gilang Swandaru — I love Go</title>
  <desc id="desc">An animated blue gopher waves beside a terminal. Gilang enjoys Go and is exploring cybersecurity and cloud computing.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0C1725"/>
      <stop offset=".55" stop-color="#10263A"/>
      <stop offset="1" stop-color="#0B1724"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#39C7E8" stop-opacity=".22"/>
      <stop offset="1" stop-color="#39C7E8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#7DD8E9"/>
      <stop offset="1" stop-color="#32AACC"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#1E3E50"/>
      <stop offset="1" stop-color="#102838"/>
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#77CDE0" stroke-opacity=".055"/>
    </pattern>
    <clipPath id="frame"><rect x="1" y="1" width="1198" height="428" rx="28"/></clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="428" rx="28" fill="url(#bg)" stroke="#36556B" stroke-width="2"/>
  <g clip-path="url(#frame)">
    <rect width="1200" height="430" fill="url(#grid)"/>
    <circle cx="1000" cy="210" r="315" fill="url(#glow)"/>
    <path d="M706 0v430" stroke="#79CCDF" stroke-opacity=".12"/>
    <path d="M44 67h119" stroke="#3BC7E8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="171" cy="67" r="3" fill="#3BC7E8"/>
    <text x="64" y="105" fill="#65D9EE" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" letter-spacing="4">HELLO, WORLD!</text>
    <text x="62" y="184" fill="#F2FAFF" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800">Gilang Swandaru</text>
    <text x="64" y="245" fill="#D7E8F0" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="600">I love</text>
    <text x="164" y="245" fill="#58D4EB" font-family="Arial, Helvetica, sans-serif" font-size="41" font-weight="800">Go.</text>
    <path d="M64 274h496" stroke="#74B7CA" stroke-opacity=".35"/>
    <text x="64" y="315" fill="#C5DBE6" font-family="Arial, Helvetica, sans-serif" font-size="22">Exploring cybersecurity</text>
    <text x="64" y="345" fill="#C5DBE6" font-family="Arial, Helvetica, sans-serif" font-size="22">&amp; cloud computing.</text>
    <circle cx="65" cy="386" r="4" fill="#44D8A7"/>
    <text x="80" y="393" fill="#7FA6B8" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="2">BUILD · LEARN · REPEAT</text>

    <circle cx="776" cy="79" r="3" fill="#84E3F1" opacity=".65">
      <animate attributeName="opacity" values=".2;.85;.2" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1086" cy="93" r="4" fill="#84E3F1" opacity=".5">
      <animate attributeName="opacity" values=".7;.15;.7" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1140" cy="275" r="3" fill="#84E3F1" opacity=".45">
      <animate attributeName="opacity" values=".25;.9;.25" dur="2.8s" repeatCount="indefinite"/>
    </circle>

    <!-- Terminal window -->
    <rect x="795" y="69" width="325" height="198" rx="18" fill="#0B1B29" stroke="#4A788D" stroke-width="2"/>
    <path d="M795 113h325" stroke="#315267" stroke-width="2"/>
    <circle cx="819" cy="92" r="5" fill="#FF7779"/>
    <circle cx="837" cy="92" r="5" fill="#FBC46D"/>
    <circle cx="855" cy="92" r="5" fill="#60D6AA"/>
    <text x="817" y="151" fill="#76A3B5" font-family="monospace" font-size="17">$ go run .</text>
    <text x="817" y="183" fill="#70DEEA" font-family="monospace" font-size="17">hello, world!</text>
    <text x="817" y="216" fill="#8EBAA8" font-family="monospace" font-size="16">learning, every day</text>
    <rect x="817" y="233" width="11" height="19" rx="2" fill="#54D8E7">
      <animate attributeName="opacity" values="1;1;0;0;1" dur="1.25s" repeatCount="indefinite"/>
    </rect>

